
name: 'Cleanup GHCR Images'

on:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches:
      - debug-verification
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  cleanup_ghcr_images:
    runs-on: ubuntu-latest
  
    steps:
      - name: Delete GHCR Unwanted Images
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55
        with:
          owner: 'haneul-24'
          package-name: 'demo'
          package-type: 'container'
          token: ${{ secrets.GITHUB_TOKEN }}
          # Keeps the last 3 images as a backup so running tests don't fail.
          min-versions-to-keep: 3
          # Strict SemVer anchor. Keeps pure versions (like 1.12.0) and wipes nightly/ephemeral tags.
          ignore-versions: '^(latest|[0-9]+\.[0-9]+\.[0-9]+)$'
          
          