name: Setup Test Images
on:
  push:
    branches:
      - debug-verification
  workflow_dispatch:
  
jobs:
  push-test-images:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Push Dummy Images
        run: |
          docker pull alpine
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Hum yahan 6 alag-alag temporary tags push kar rahe hain 
          # Taaki total versions 3 se zyada ho jayein.
          for i in {1..6}; do
            docker tag alpine ghcr.io/${{ github.repository }}/demo:temp-test-$i
            docker push ghcr.io/${{ github.repository }}/demo:temp-test-$i
          done