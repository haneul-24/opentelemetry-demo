name: Setup Test Images
on:
  push:
    branches:
      - debug-verification
  workflow_dispatch:

jobs:
  push-test-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [3.12.2, nightly-a, nightly-b, 1.1.1, 2.12.4, temp-test, 1.2.2]
    permissions:
      packages: write
    steps:
      - name: Push Dummy Images
        run: |
          # docker pull alpine
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Yahan magic: Hum ek dummy file bana rahe hain jo har matrix run mein alag hogi
          echo "${{ matrix.version }}-${{ github.run_id }}" > dummy.txt
          
          # Ab hum alpine se ek nayi image "commit" kar rahe hain
          # Hum ek temporary container banayenge aur usme apni dummy file daal denge
          container_id=$(docker create alpine:latest)
          docker cp dummy.txt $container_id:/dummy.txt
          docker commit $container_id ghcr.io/haneul-24/demo:${{ matrix.version }}
          
          # Ab push karo
          docker push ghcr.io/haneul-24/demo:${{ matrix.version }}

