name: Setup Test Images
on:
  push:
    branches:
      - debug-verification
  workflow_dispatch:

jobs:
  push-test-images:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Push Dummy Images
        run: |
          docker pull alpine
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Pull kar lo
          docker pull alpine:latest

          # 3 Tags jo SAVE honge (Regex match karenge)
          docker tag alpine:latest ghcr.io/haneul-24/demo:1.1.0
          docker push ghcr.io/haneul-24/demo:1.1.0

          docker tag alpine:latest ghcr.io/haneul-24/demo:1.1.1
          docker push ghcr.io/haneul-24/demo:1.1.1

          docker tag alpine:latest ghcr.io/haneul-24/demo:latest
          docker push ghcr.io/haneul-24/demo:latest

          # 3 Tags jo DELETE honge (Regex match nahi karenge)
          docker tag alpine:latest ghcr.io/haneul-24/demo:nightly-a
          docker push ghcr.io/haneul-24/demo:nightly-a

          docker tag alpine:latest ghcr.io/haneul-24/demo:nightly-b
          docker push ghcr.io/haneul-24/demo:nightly-b

          docker tag alpine:latest ghcr.io/haneul-24/demo:temp-test
          docker push ghcr.io/haneul-24/demo:temp-test